    const { useState, useEffect, useRef } = React;

    // --- 3D CANVAS COMPONENTS ---

    // 1. Hero Holographic Brain Canvas
    const Hero3DCanvas = () => {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth;
        const height = container.clientHeight || 550;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.z = 6.5;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        container.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);

        // Holographic brain representation: Point cluster sphere
        const particleCount = 140;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const radius = 1.9;

        for (let i = 0; i < particleCount; i++) {
          const u = Math.random();
          const v = Math.random();
          const theta = u * 2.0 * Math.PI;
          const phi = Math.acos(2.0 * v - 1.0);

          positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
          positions[i * 3 + 2] = radius * Math.cos(phi);
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
          color: 0x00f0ff,
          size: 0.055,
          transparent: true,
          opacity: 0.85,
        });
        const points = new THREE.Points(geometry, material);
        group.add(points);

        // Connections (Lines)
        const lineMaterial = new THREE.LineBasicMaterial({
          color: 0xa855f7,
          transparent: true,
          opacity: 0.22,
        });
        const lineGeometry = new THREE.BufferGeometry();
        const linePositions = [];

        for (let i = 0; i < particleCount; i++) {
          const x1 = positions[i * 3];
          const y1 = positions[i * 3 + 1];
          const z1 = positions[i * 3 + 2];

          for (let j = i + 1; j < particleCount; j++) {
            const x2 = positions[j * 3];
            const y2 = positions[j * 3 + 1];
            const z2 = positions[j * 3 + 2];

            const dist = Math.sqrt((x1 - x2) ** 2 + (y1 - y2) ** 2 + (z1 - z2) ** 2);
            if (dist < 1.1) {
              linePositions.push(x1, y1, z1, x2, y2, z2);
            }
          }
        }
        lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
        const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
        group.add(lines);

        // Outer rotating ring pathways
        const ringGeom = new THREE.RingGeometry(2.3, 2.34, 64);
        const ringMat = new THREE.MeshBasicMaterial({ 
          color: 0x00f0ff, 
          side: THREE.DoubleSide, 
          transparent: true, 
          opacity: 0.35 
        });
        const ring = new THREE.Mesh(ringGeom, ringMat);
        ring.rotation.x = Math.PI / 2.3;
        ring.rotation.y = Math.PI / 8;
        group.add(ring);

        // Floating ambient dust in background
        const bgCount = 200;
        const bgGeom = new THREE.BufferGeometry();
        const bgPositions = new Float32Array(bgCount * 3);

        for (let i = 0; i < bgCount; i++) {
          bgPositions[i * 3] = (Math.random() - 0.5) * 15;
          bgPositions[i * 3 + 1] = (Math.random() - 0.5) * 15;
          bgPositions[i * 3 + 2] = (Math.random() - 0.5) * 8 - 4;
        }
        bgGeom.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
        const bgMat = new THREE.PointsMaterial({
          color: 0xffffff,
          size: 0.025,
          transparent: true,
          opacity: 0.3,
        });
        const bgPoints = new THREE.Points(bgGeom, bgMat);
        scene.add(bgPoints);

        // Mouse responsive tilt properties
        let mouseX = 0, mouseY = 0;
        const onMouseMove = (e) => {
          mouseX = (e.clientX / window.innerWidth) - 0.5;
          mouseY = (e.clientY / window.innerHeight) - 0.5;
        };
        window.addEventListener('mousemove', onMouseMove);

        let isVisible = true;
        const observer = new IntersectionObserver(([entry]) => {
          isVisible = entry.isIntersecting;
        }, { threshold: 0.01 });
        observer.observe(container);

        let reqId;
        const animate = () => {
          reqId = requestAnimationFrame(animate);
          if (!isVisible) return;

          // Smooth mouse physics easing
          group.rotation.y += (mouseX * 1.5 - group.rotation.y) * 0.05;
          group.rotation.x += (mouseY * 1.5 - group.rotation.x) * 0.05;

          // Ambient idle rotation
          group.rotation.y += 0.003;
          points.rotation.y -= 0.001;
          ring.rotation.z += 0.006;
          bgPoints.rotation.y += 0.0005;

          // Scroll depth parallax shifting
          const scroll = window.scrollY;
          group.position.y = -scroll * 0.0008;
          bgPoints.position.y = scroll * 0.0015;

          renderer.render(scene, camera);
        };
        animate();

        const onResize = () => {
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight || 550;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', onResize);

        return () => {
          observer.disconnect();
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('resize', onResize);
          cancelAnimationFrame(reqId);
          renderer.dispose();
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
        };
      }, []);

      return (
        <div ref={mountRef} className="w-full h-[380px] md:h-[550px] relative z-10" />
      );
    };

    // 2. About Glass AI Globe Canvas
    const About3DCanvas = () => {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth;
        const height = container.clientHeight || 450;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.z = 5.5;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        container.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);

        // Core globe mesh wireframe
        const sphereGeo = new THREE.SphereGeometry(1.6, 20, 20);
        const sphereMat = new THREE.MeshBasicMaterial({
          color: 0xa855f7,
          wireframe: true,
          transparent: true,
          opacity: 0.14
        });
        const globe = new THREE.Mesh(sphereGeo, sphereMat);
        group.add(globe);

        // Globe vertices glowing connection points
        const pointsMat = new THREE.PointsMaterial({
          color: 0x00f0ff,
          size: 0.05,
          transparent: true,
          opacity: 0.8
        });
        const globePoints = new THREE.Points(sphereGeo, pointsMat);
        group.add(globePoints);

        // Neural network connections orbiting
        const orbitalLinesMat = new THREE.LineBasicMaterial({
          color: 0x00f0ff,
          transparent: true,
          opacity: 0.2
        });
        
        const orbitCount = 3;
        const orbits = [];
        for (let i = 0; i < orbitCount; i++) {
          const orbitGeom = new THREE.BufferGeometry();
          const orbitPos = [];
          const r = 1.8 + i * 0.12;
          const segments = 40;
          for (let j = 0; j <= segments; j++) {
            const theta = (j / segments) * Math.PI * 2;
            orbitPos.push(r * Math.cos(theta), r * Math.sin(theta), 0);
          }
          orbitGeom.setAttribute('position', new THREE.Float32BufferAttribute(orbitPos, 3));
          const line = new THREE.Line(orbitGeom, orbitalLinesMat);
          line.rotation.x = Math.random() * Math.PI;
          line.rotation.y = Math.random() * Math.PI;
          group.add(line);
          orbits.push(line);
        }

        let mouseX = 0, mouseY = 0;
        const onMouseMove = (e) => {
          const rect = container.getBoundingClientRect();
          mouseX = ((e.clientX - rect.left) / rect.width) - 0.5;
          mouseY = ((e.clientY - rect.top) / rect.height) - 0.5;
        };
        container.addEventListener('mousemove', onMouseMove);

        let isVisible = true;
        const observer = new IntersectionObserver(([entry]) => {
          isVisible = entry.isIntersecting;
        }, { threshold: 0.01 });
        observer.observe(container);

        let reqId;
        const animate = () => {
          reqId = requestAnimationFrame(animate);
          if (!isVisible) return;

          // Tilts based on mouse position inside about container
          group.rotation.y += (mouseX * 1.2 - group.rotation.y) * 0.05;
          group.rotation.x += (mouseY * 1.2 - group.rotation.x) * 0.05;

          // Orbit slow rotation
          group.rotation.y += 0.002;
          orbits.forEach((orb, index) => {
            orb.rotation.z += 0.004 * (index + 1);
          });

          renderer.render(scene, camera);
        };
        animate();

        const onResize = () => {
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight || 450;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', onResize);

        return () => {
          observer.disconnect();
          container.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('resize', onResize);
          cancelAnimationFrame(reqId);
          renderer.dispose();
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
        };
      }, []);

      return (
        <div ref={mountRef} className="w-full h-[320px] md:h-[450px] relative z-10" />
      );
    };

    // 3. CTA Glowing pulsing sphere Canvas
    const Cta3DCanvas = () => {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth;
        const height = container.clientHeight || 400;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.z = 5.5;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        container.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);

        // Icosahedron glowing mesh
        const geom = new THREE.IcosahedronGeometry(1.6, 2);
        const mat = new THREE.MeshBasicMaterial({
          color: 0x00f0ff,
          wireframe: true,
          transparent: true,
          opacity: 0.18
        });
        const sphere = new THREE.Mesh(geom, mat);
        group.add(sphere);

        // Core central glowing point points
        const glowPointsMat = new THREE.PointsMaterial({
          color: 0xa855f7,
          size: 0.08,
          transparent: true,
          opacity: 0.7
        });
        const points = new THREE.Points(geom, glowPointsMat);
        group.add(points);

        // Fast warping particles in background
        const particleCount = 150;
        const bgGeom = new THREE.BufferGeometry();
        const bgPositions = new Float32Array(particleCount * 3);
        const speeds = [];

        for (let i = 0; i < particleCount; i++) {
          bgPositions[i * 3] = (Math.random() - 0.5) * 10;
          bgPositions[i * 3 + 1] = (Math.random() - 0.5) * 10;
          bgPositions[i * 3 + 2] = Math.random() * -10;
          speeds.push(0.02 + Math.random() * 0.03);
        }
        bgGeom.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
        const bgMat = new THREE.PointsMaterial({
          color: 0xffffff,
          size: 0.03,
          transparent: true,
          opacity: 0.4
        });
        const warpingDust = new THREE.Points(bgGeom, bgMat);
        scene.add(warpingDust);

        let isVisible = true;
        const observer = new IntersectionObserver(([entry]) => {
          isVisible = entry.isIntersecting;
        }, { threshold: 0.01 });
        observer.observe(container);

        let reqId;
        let count = 0;
        const animate = () => {
          reqId = requestAnimationFrame(animate);
          if (!isVisible) return;

          count += 0.01;
          const pulse = Math.sin(count) * 0.1 + 1.0;
          group.scale.set(pulse, pulse, pulse);

          group.rotation.x += 0.003;
          group.rotation.y += 0.004;

          // Wrap particles coordinates to create continuous warp path
          const pos = warpingDust.geometry.attributes.position.array;
          for (let i = 0; i < particleCount; i++) {
            pos[i * 3 + 2] += speeds[i]; // Move closer in Z
            if (pos[i * 3 + 2] > 2) {
              pos[i * 3 + 2] = -10; // reset depth far away
            }
          }
          warpingDust.geometry.attributes.position.needsUpdate = true;

          renderer.render(scene, camera);
        };
        animate();

        const onResize = () => {
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight || 400;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', onResize);

        return () => {
          observer.disconnect();
          window.removeEventListener('resize', onResize);
          cancelAnimationFrame(reqId);
          renderer.dispose();
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
        };
      }, []);

      return (
        <div ref={mountRef} className="w-full h-full absolute inset-0 z-0 pointer-events-none opacity-50" />
      );
    };

                      <div className={`w-14 h-14 rounded-2xl border flex justify-center items-center ${theme.bgIcon}`}>
                        <i data-lucide={enrollModal.icon} className="w-6 h-6"></i>
                      </div>
                      <span className="px-3 py-1 rounded-full text-[10px] font-mono uppercase tracking-wider border border-white/10 text-gray-400" style={{ background: 'rgba(255,255,255,0.03)' }}>
                        {enrollModal.badge}
                      </span>
                    </div>

                    {/* Course Title */}
                    <h2 className="text-2xl font-black uppercase tracking-tight text-white font-heading mb-1">
                      {enrollModal.title}
                    </h2>
                    {enrollModal.subtitle && (
                      <p className="text-[10px] font-mono text-gray-500 uppercase tracking-widest mb-3">{enrollModal.subtitle}</p>
                    )}
                    <p className="text-gray-500 text-xs leading-relaxed mb-6">{enrollModal.description}</p>

                    {/* Meta row */}
                    <div className="flex items-center space-x-4 mb-6">
                      <span className="flex items-center text-[10px] font-mono text-gray-500">
                        <i data-lucide="clock" className="w-3 h-3 mr-1.5"></i>
                        {enrollModal.duration}
                      </span>
                      <span className="w-px h-4 bg-white/5"></span>
                      <div className="flex flex-wrap gap-1.5">
                        {enrollModal.tools.map((t, i) => (
                          <span key={i} className="px-2 py-0.5 rounded text-[9px] font-mono text-gray-500 bg-white/[0.03] border border-white/5">{t}</span>
                        ))}
                      </div>
                    </div>

                    {/* Divider */}
                    <div className="border-t border-white/5 mb-6" />

                    {/* Pricing */}
                    <div className="flex items-end justify-between mb-6">
                      <div>
                        <div className="flex items-baseline space-x-2">
                          <span className="text-3xl font-black font-heading" style={{ color: enrollModal.colorCode }}>{enrollModal.price}</span>
                          <span className="text-sm font-mono text-gray-600 line-through">{enrollModal.originalPrice}</span>
                        </div>
                        <span className="text-[10px] font-mono uppercase tracking-wider" style={{ color: enrollModal.colorCode, opacity: 0.7 }}>
                          {enrollModal.discount} · One-time payment
                        </span>
                      </div>
                      <span className="px-3 py-1.5 rounded-full text-[10px] font-mono text-white border border-white/10 bg-white/5">
                        Lifetime Access
                      </span>
                    </div>

                    {/* Razorpay Pay Button */}
                    <button
                      onClick={handleRazorpayPay}
                      className="w-full py-4 rounded-2xl text-sm font-bold uppercase tracking-wider text-white transition-all duration-300 flex items-center justify-center space-x-3 hover:scale-[1.02] active:scale-[0.99]"
                      style={{
                        background: 'linear-gradient(135deg, #528FF0 0%, #3a73d8 100%)',
                        boxShadow: '0 0 30px rgba(82,143,240,0.3)',
                      }}
                    >
                      {/* Razorpay logo SVG */}
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19.5 4.5L14.25 19.5L10.5 12L4.5 9.75L19.5 4.5Z" fill="white" />
                        <path d="M10.5 12L14.25 19.5L12 15.75L10.5 12Z" fill="rgba(255,255,255,0.5)" />
                      </svg>
                      <span>Pay with Razorpay</span>
                    </button>

                    {/* Trust note */}
                    <p className="text-center text-[10px] font-mono text-gray-600 mt-4 flex items-center justify-center space-x-1.5">
                      <i data-lucide="shield-check" className="w-3 h-3 text-green-500"></i>
                      <span>Secured by Razorpay · 256-bit SSL encryption</span>
                    </p>

                  </div>
                </div>
              </div>
            );
          })()}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
