                                      <tr key={lec.id} className="border-b border-white/[0.02] hover:bg-white/[0.01] transition-all">
                                        <td className="py-4 lg:py-5 text-gray-600 pl-2 lg:pl-4">{idx + 1}</td>
                                        <td className="py-4 lg:py-5">
                                          <p className="font-bold text-gray-200">{lec.title}</p>
                                          <p className="text-[10px] lg:text-xs text-gray-500 truncate max-w-sm mt-0.5">{lec.description}</p>
                                        </td>
                                        <td className="py-4 lg:py-5">
                                          <span className={`px-2 py-0.5 rounded text-[9px] lg:text-xs font-bold border ${
                                            lec.difficulty === 'Beginner' ? 'bg-brand-emerald/10 border-brand-emerald/25 text-brand-emerald' :
                                            lec.difficulty === 'Intermediate' ? 'bg-brand-cyan/10 border-brand-cyan/25 text-brand-cyan' : 'bg-rose-500/10 border-rose-500/25 text-rose-500'
                                          }`}>
                                            {lec.difficulty}
                                          </span>
                                        </td>
                                        <td className="py-4 lg:py-5 text-gray-400">{lec.duration}</td>
                                        <td className="py-4 lg:py-5 text-gray-400">{(lec.resources || []).length} items</td>
                                        <td className="py-4 lg:py-5 text-center pr-2 lg:pr-4 whitespace-nowrap">
                                          <div className="inline-flex items-center gap-1.5">
                                          <button
                                            type="button"
                                            onClick={() => {
                                              setEditingLecture(lec);
                                              setNewLectureTitle(lec.title || '');
                                              setNewLectureDesc(lec.description || '');
                                              setNewLectureDifficulty(lec.difficulty || 'Beginner');
                                              setNewLectureDuration(lec.duration || '1 min');
                                              setNewLectureTags((lec.tags || []).join(', '));
                                              setNewLectureVideoUrl(lec.videoUrl || '');
                                              setNewLectureResources(lec.resources || []);
                                              setShowAddLectureModal(true);
                                            }}
                                            className="px-3 py-1.5 lg:px-4 lg:py-2 rounded-lg bg-brand-cyan/10 hover:bg-brand-cyan border border-brand-cyan/20 text-brand-cyan hover:text-black transition"
                                          >
                                            Edit
                                          </button>
                                          <button
                                            type="button"
                                            onClick={() => {
                                              if (confirm(`Are you sure you want to delete lecture "${lec.title}"?`)) {
                                                handleDeleteLecture(adminSelectedLectureCourse, lec.id);
                                              }
                                            }}
                                            className="px-3 py-1.5 lg:px-4 lg:py-2 rounded-lg bg-rose-500/10 hover:bg-rose-500 border border-rose-500/20 text-rose-500 hover:text-white transition"
                                          >
                                            Delete
                                          </button>
                                          </div>
                                        </td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            );
                          })()}
                        </div>
                      </div>
                    )}

                    {/* Add/Edit Lecture Modal Dialog */}
                    {showAddLectureModal && (
                      <div className="fixed inset-0 z-[100002] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                        <div 
                          className="relative w-full max-w-lg lg:max-w-5xl rounded-3xl border border-white/10 text-left"
                          style={{
                            background: 'linear-gradient(145deg, #0e0e0e 0%, #111111 100%)',
                            boxShadow: '0 0 60px rgba(0,240,255,0.15), 0 30px 80px rgba(0,0,0,0.8)',
                          }}
                        >
                          <div className="h-1 w-full bg-gradient-to-r from-brand-cyan to-brand-blue" />
                          
                          <button
                            type="button"
                            onClick={() => {
                              setShowAddLectureModal(false);
                              setNewLectureTitle('');
                              setNewLectureDesc('');
                              setNewLectureDifficulty('Beginner');
                              setNewLectureDuration('1 min');
                              setNewLectureTags('');
                              setNewLectureVideoUrl('');
                              setNewLectureResources([]);
                              setEditingLecture(null);
                            }}
                            className="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 transition z-10"
                          >
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                          </button>

                          <form onSubmit={handleSaveNewLecture} className="p-8 lg:p-10 max-h-[85vh] overflow-y-auto">
                            <h3 className="text-lg lg:text-xl font-black uppercase text-white font-heading tracking-wide mb-1 pr-8">{editingLecture ? 'Edit Lecture' : 'Add Lecture to Syllabus'}</h3>
                            <p className="text-[10px] lg:text-xs font-mono text-gray-500 uppercase tracking-widest mb-6">
                              {editingLecture ? `Editing: ${editingLecture.title}` : `Target: ${adminSelectedLectureCourse}`}
                            </p>

                            {/* Horizontal split: left (info) + right (media) on desktop, stacked on mobile */}
                            <div className="lg:grid lg:grid-cols-2 lg:gap-10 space-y-4 lg:space-y-0">

                              {/* ─── Left Column: Basic Info ─── */}
                              <div className="space-y-4">
                                <div>
                                  <label className="text-[9px] lg:text-[11px] font-mono text-gray-500 uppercase tracking-widest block mb-1.5">Lecture Title</label>
                                  <input
                                    type="text"
                                    placeholder="e.g. Photoshop Layout Design Masterclass"
                                    value={newLectureTitle}
                                    onChange={e => setNewLectureTitle(e.target.value)}
                                    className="w-full px-4 py-2.5 rounded-xl bg-white/[0.03] border border-white/10 text-white text-xs focus:outline-none focus:border-brand-cyan/50 transition"
                                    style={{ outline: 'none' }}
                                  />
                                </div>

                                <div>
                                  <label className="text-[9px] font-mono text-gray-500 uppercase tracking-widest block mb-1.5">Summary / Description</label>
                                  <textarea
                                    placeholder="Provide student reference overview details..."
                                    value={newLectureDesc}
                                    onChange={e => setNewLectureDesc(e.target.value)}
                                    rows={4}
                                    className="w-full px-4 py-2.5 rounded-xl bg-white/[0.03] border border-white/10 text-white text-xs focus:outline-none focus:border-brand-cyan/50 transition resize-none"
                                    style={{ outline: 'none' }}
                                  />
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                  <div>
                                    <label className="text-[9px] font-mono text-gray-500 uppercase tracking-widest block mb-1.5">Difficulty level</label>
                                    <select
                                      value={newLectureDifficulty}
                                      onChange={e => setNewLectureDifficulty(e.target.value)}
                                      className="w-full px-4 py-2.5 rounded-xl bg-[#111] border border-white/10 text-white text-xs focus:outline-none focus:border-brand-cyan/50 transition"
                                      style={{ outline: 'none' }}
                                    >
                                      <option value="Beginner">Beginner</option>
                                      <option value="Intermediate">Intermediate</option>
                                      <option value="Advanced">Advanced</option>
                                    </select>
                                  </div>
                                  <div>
                                    <label className="text-[9px] font-mono text-gray-500 uppercase tracking-widest block mb-1.5">Duration</label>
                                    <input
                                      type="text"
                                      placeholder="e.g. 15 mins, 2 mins"
                                      value={newLectureDuration}
                                      onChange={e => setNewLectureDuration(e.target.value)}
                                      className="w-full px-4 py-2.5 rounded-xl bg-white/[0.03] border border-white/10 text-white text-xs focus:outline-none focus:border-brand-cyan/50 transition"
                                      style={{ outline: 'none' }}
                                    />
                                  </div>
                                </div>

                                <div>
                                  <label className="text-[9px] font-mono text-gray-500 uppercase tracking-widest block mb-1.5">Tags (Comma Separated)</label>
                                  <input
                                    type="text"
                                    placeholder="e.g. CGI, Composition, Photoshop"
                                    value={newLectureTags}
                                    onChange={e => setNewLectureTags(e.target.value)}
                                    className="w-full px-4 py-2.5 rounded-xl bg-white/[0.03] border border-white/10 text-white text-xs focus:outline-none focus:border-brand-cyan/50 transition"
                                    style={{ outline: 'none' }}
                                  />
                                </div>
                              </div>

                              {/* ─── Right Column: Media & Resources ─── */}
                              <div className="space-y-5">
                                {/* Video Uploader / URL paste */}
                                <div className="p-4 lg:p-6 rounded-2xl bg-white/[0.01] border border-white/5 space-y-3 lg:space-y-4">
                                  <div className="flex items-center justify-between">
                                    <label className="text-[9px] font-mono text-brand-cyan uppercase tracking-widest font-bold">Lecture Video</label>
                                    <span className="text-[8px] font-mono text-gray-500">PASTE DIRECT LINK OR UPLOAD</span>
                                  </div>
                                  <input
                                    type="text"
                                    placeholder="Paste .mp4 link or YouTube URL..."
                                    value={newLectureVideoUrl}
                                    onChange={e => setNewLectureVideoUrl(e.target.value)}
                                    className="w-full px-4 py-2.5 rounded-xl bg-white/[0.03] border border-white/10 text-white text-xs focus:outline-none focus:border-brand-cyan/50 transition"
                                    style={{ outline: 'none' }}
                                  />
                                  <div className="flex items-center space-x-3">
                                    <label className="px-4 py-2 bg-white/5 border border-white/10 text-[10px] font-mono font-bold rounded-lg cursor-pointer hover:bg-white/10 hover:text-white transition shrink-0">
                                      <input 
                                        type="file" 
                                        className="hidden" 
                                        accept="video/*" 
                                        onChange={handleAdminLectureUpload}
                                      />
                                      Choose Video File 🎥
                                    </label>
                                    {lectureUploadingProgress !== null && (
                                      <div className="flex-grow flex items-center space-x-2">
                                        <div className="flex-grow h-1.5 rounded bg-white/5 overflow-hidden">
                                          <div className="h-full bg-brand-cyan transition-all duration-300" style={{ width: `${lectureUploadingProgress}%` }} />
                                        </div>
                                        <span className="text-[9px] font-mono text-brand-cyan font-bold">{lectureUploadingProgress}%</span>
                                      </div>
                                    )}
                                  </div>
                                </div>

                                {/* Resources List Creator */}
                                <div className="p-4 lg:p-6 rounded-2xl bg-white/[0.01] border border-white/5 space-y-3 lg:space-y-4">
                                  <label className="text-[9px] lg:text-[11px] font-mono text-brand-violet uppercase tracking-widest block font-bold">Downloadable Resources</label>
                                  
                                  {newLectureResources.length > 0 && (
                                    <div className="space-y-1.5 max-h-28 overflow-y-auto mb-2">
                                      {newLectureResources.map((res, i) => (
                                        <div key={i} className="flex items-center justify-between text-[10px] lg:text-xs bg-white/5 px-3 py-1.5 lg:px-4 lg:py-2 rounded-lg border border-white/5 font-mono">
                                          <span className="truncate max-w-[160px] text-gray-300">{res.name} ({res.size})</span>
                                          <button 
                                            type="button" 
                                            onClick={() => setNewLectureResources(prev => prev.filter((_, idx) => idx !== i))}
                                            className="text-rose-500 hover:text-white transition shrink-0"
                                          >
                                            Remove
                                          </button>
                                        </div>
                                      ))}
                                    </div>
                                  )}

                                  <div className="flex items-center space-x-3">
                                    <label className="px-4 py-2 lg:px-5 lg:py-2.5 bg-white/5 border border-white/10 text-[10px] lg:text-xs font-mono font-bold rounded-lg cursor-pointer hover:bg-white/10 hover:text-white transition">
                                      <input 
                                        type="file" 
                                        className="hidden" 
                                        onChange={handleAdminResourceUpload}
                                      />
                                      Upload Template File 📁
                                    </label>
                                    {resourceUploadingProgress !== null && (
                                      <div className="flex-grow flex items-center space-x-2">
                                        <div className="flex-grow h-1.5 rounded bg-white/5 overflow-hidden">
                                          <div className="h-full bg-brand-cyan transition-all duration-300" style={{ width: `${resourceUploadingProgress}%` }} />
                                        </div>
                                        <span className="text-[9px] lg:text-xs font-mono text-brand-cyan font-bold">{resourceUploadingProgress}%</span>
                                      </div>
                                    )}
                                  </div>
                                </div>

                                {/* Save button — inside right column so it sits at bottom on desktop */}
                                <button
                                  type="submit"
                                  disabled={newLectureSaving}
                                  className="w-full py-3.5 lg:py-4 rounded-xl text-xs lg:text-sm font-bold uppercase tracking-wider text-black transition bg-brand-cyan hover:scale-[1.01] active:scale-[0.99] disabled:opacity-50 disabled:scale-100 shadow-[0_0_20px_rgba(0,240,255,0.15)]"
                                >
                                  {newLectureSaving ? 'Saving...' : editingLecture ? 'Update Lecture & Sync' : 'Save Lecture & Sync'}
                                </button>
                              </div>

                            </div>
                          </form>
                        </div>
                      </div>
                    )}
                  </main>

                  {/* Media Preview Modal Overlay */}
                  {activePreviewMedia && (
                    <div 
                      onClick={() => setActivePreviewMedia(null)}
                      className="fixed inset-0 z-[100001] bg-black/95 backdrop-blur-md flex items-center justify-center p-4"
                    >
                      <button
                        onClick={() => setActivePreviewMedia(null)}
                        className="absolute top-6 right-6 w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 transition"
                      >
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" className="w-5 h-5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                      </button>
                      
                      <div className="max-w-4xl max-h-[85vh] relative" onClick={e => e.stopPropagation()}>
                        {activePreviewMedia.type === 'image' ? (
                          <img 
                            src={activePreviewMedia.url} 
                            alt="Fullscreen attachment preview" 
                            className="max-h-[80vh] max-w-full object-contain rounded-2xl border border-white/15" 
                          />
                        ) : (() => {
                          const fileId = getDriveFileId(activePreviewMedia.url);
                          if (fileId) {
                            return (
                              <iframe 
                                src={`https://drive.google.com/file/d/${fileId}/preview`} 
                                className="w-[85vw] h-[48vh] md:w-[70vw] md:h-[60vh] max-w-4xl rounded-2xl border border-white/15 bg-black" 
                                allow="autoplay"
                                allowFullScreen
                              />
                            );
                          }
                          return (
                            <video 
                              src={activePreviewMedia.url} 
                              controls 
                              autoPlay 
                              className="max-h-[80vh] max-w-full rounded-2xl border border-white/15" 
                            />
                          );
                        })()}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Scroll Reveal Init -->
  <script>
    window.addEventListener('load', () => {
      // ── Scroll Reveal Observer ───────────────────────────────────────────
      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add('is-visible');
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

      const observe = () => {
        document.querySelectorAll('.reveal-up:not(.is-visible), .reveal-fade:not(.is-visible), .reveal-scale:not(.is-visible)')
          .forEach(el => revealObserver.observe(el));
      };
      observe();

      // Re-observe after React renders
      new MutationObserver(observe).observe(document.body, { childList: true, subtree: true });
    });
  </script>
</body>
</html>
