  <!-- Soundwave Animation Styles for Web Audio Recording -->
  <style>
    @keyframes toolFadeIn {
      0% { opacity: 0; transform: translateY(24px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes soundwave {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }
    .animate-wave-1 { animation: soundwave 0.6s ease-in-out infinite; }
    .animate-wave-2 { animation: soundwave 0.8s ease-in-out infinite 0.15s; }
    .animate-wave-3 { animation: soundwave 0.5s ease-in-out infinite 0.3s; }
    .animate-wave-4 { animation: soundwave 0.7s ease-in-out infinite 0.05s; }
    .animate-wave-5 { animation: soundwave 0.9s ease-in-out infinite 0.2s; }
    @keyframes scan {
      0% { transform: translateY(0); }
      100% { transform: translateY(100%); }
    }
    .animate-scan { animation: scan 8s linear infinite; }
    @keyframes bounce-x {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(6px); }
    }
    .animate-bounce-x { animation: bounce-x 1.2s ease-in-out infinite; }
    @keyframes slideDown {
      0% { opacity: 0; transform: translateY(-16px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-slideDown { animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; will-change: transform, opacity; }
    @keyframes popup {
      0% { opacity: 0; transform: scale(0.35) translateY(120px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-popup { animation: popup 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; will-change: transform, opacity; transform-origin: bottom center; }
    @keyframes popupOut {
      0% { opacity: 1; transform: scale(1) translateY(0); }
      100% { opacity: 0; transform: scale(0.3) translateY(80px); }
    }
    .animate-popupOut { animation: popupOut 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; will-change: transform, opacity; transform-origin: bottom center; }
    @keyframes studentPopup {
      0% { transform: translateY(100%); }
      100% { transform: translateY(0); }
    }
    .animate-student-popup { animation: studentPopup 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; will-change: transform; }
    @keyframes studentPopupOut {
      0% { transform: translateY(0); }
      100% { transform: translateY(100%); }
    }
    .animate-student-popupOut { animation: studentPopupOut 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; will-change: transform; }
    @keyframes slideUpPopup {
      0% { transform: translateY(100%); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes slideDownOut {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(100%); opacity: 0; }
    }
    .animate-slideUp { animation: slideUpPopup 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; will-change: transform, opacity; }
    .animate-slideDownOut { animation: slideDownOut 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; will-change: transform, opacity; }
    @keyframes shimmer { 0% { transform: skewX(-20deg) translateX(-100%); } 100% { transform: skewX(-20deg) translateX(400%); } }
    .animate-shimmer { animation: shimmer 2s ease-in-out infinite; }
    video::-webkit-media-controls { display: none !important; }
    video::-webkit-media-controls-panel { display: none !important; -webkit-appearance: none; }
    video::--webkit-media-controls-play-button { display: none !important; }
    video::-webkit-media-controls-start-playback-button { display: none !important; }
  </style>

<body class="bg-brand-bg text-gray-200 selection:bg-brand-cyan/20 selection:text-brand-cyan">

  <!-- React & JSX Application Source Code -->
  <script src="app.js"></script>

  <!-- Scroll Reveal Init -->
  <script>
    window.addEventListener('load', () => {
      // ── Scroll Reveal Observer ───────────────────────────────────────────
      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add('is-visible');
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

      const observe = () => {
        document.querySelectorAll('.reveal-up:not(.is-visible), .reveal-fade:not(.is-visible), .reveal-scale:not(.is-visible)')
          .forEach(el => revealObserver.observe(el));
      };
      observe();

      // Re-observe after React renders
      new MutationObserver(observe).observe(document.body, { childList: true, subtree: true });
    });
  </script>
